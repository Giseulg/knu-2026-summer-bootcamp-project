project:
  title: SpoKeeper
  summary: 독자의 현재 EPUB 독서 위치까지만 분석하여 인물 관계도와 맥락 리마인드를 제공하는 스포일러 방지 AI 독서 서비스
  category: AI 서비스
  keywords:
    - AI
    - EPUB
    - Spoiler Safety
    - Knowledge Graph
    - Multi-Agent

problem:
  summary: 기존 AI 요약과 검색 서비스가 책 전체를 참조하면서 아직 읽지 않은 내용을 노출할 수 있는 문제를 해결합니다.
  target_users:
    - 장편 소설의 등장인물과 관계를 기억하기 어려운 독자
    - 스포일러 없이 이전 독서 내용을 복습하고 싶은 독자

solution:
  summary: EPUB CFI를 전역 문단 위치로 변환해 독서 경계를 강제하고 다단계 AI 검증으로 현재 위치까지 확인된 정보만 제공합니다.
  main_features:
    - EPUB CFI와 global_index 기반 스포일러 경계
    - 독서 위치별 인물 관계도와 주요·기타 등장인물 필터
    - 검증된 사건과 관계 기반 맥락 리마인드
    - 간접 암시와 복선을 검사하는 다단계 AI 가드
    - EPUB 업로드와 백그라운드 분석

tech_stack:
  frontend:
    - React
    - TypeScript
    - Vite
    - Cytoscape.js
    - epub.js
  backend:
    - FastAPI
    - Python
  ai:
    - Upstage Solar Pro 2
    - LangChain
  database:
    - PostgreSQL
    - Supabase
    - SQLite
    - Redis
  infra:
    - Docker
    - Docker Compose
    - Nginx

